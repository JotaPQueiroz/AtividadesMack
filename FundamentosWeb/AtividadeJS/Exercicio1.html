<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Exercício 1</title>
</head>
<body>
    <script>
        
        var resposta = prompt("Você mora na cidade de São Paulo? (Responda sim ou não)");

        
        if (resposta.toLowerCase() === "sim") {
            document.write('<img src="images/paulista.jpg" alt="Imagem de São Paulo">');
        } else {
            document.write('<img src="images/cotia.png" alt="Imagem de Cotia">');
        }
    </script>
</body>
</html>
